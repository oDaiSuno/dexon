appId: app.dexon.desktop
productName: Dexon
copyright: Copyright © Dexon

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - "!out/remote-payload/**"
  - package.json
  - LICENSE
  - build/icon.png
  - build/entitlements.mac.plist
  - "!**/*.map"
  - "!**/*.{md,markdown,ts,tsx}"
  - "!**/*.d.{mts,cts}"
  - "!scripts/**"
  - "!src/**"
  - "!dist/**"
  - "!tsconfig*.json"
  - "!tsup.config.ts"
  - "!vite.config.ts"
  - "!electron-builder.yml"
  - "!node_modules/@earendil-works/pi-coding-agent/docs/**/*"
  - "!node_modules/@earendil-works/pi-coding-agent/examples/**/*"
  - from: node_modules/@earendil-works/pi-coding-agent
    to: node_modules/@earendil-works/pi-coding-agent
    filter:
      - README.md
      - "docs/**/*"
      - "examples/**/*"
      - "dist/**/*.d.ts"
  - from: node_modules/@earendil-works/pi-ai
    to: node_modules/@earendil-works/pi-ai
    filter:
      - README.md
      - "dist/**/*.d.ts"
  - from: node_modules/@earendil-works/pi-agent-core
    to: node_modules/@earendil-works/pi-agent-core
    filter:
      - README.md
      - "dist/**/*.d.ts"
  - from: node_modules/@earendil-works/pi-codemode
    to: node_modules/@earendil-works/pi-codemode
    filter:
      - README.md
      - "dist/**/*.d.ts"
  - from: node_modules/@earendil-works/pi-mcp
    to: node_modules/@earendil-works/pi-mcp
    filter:
      - README.md
      - "dist/**/*.d.ts"
      - "LICENSES/**/*"
  - from: node_modules/@earendil-works/pi-telemetry
    to: node_modules/@earendil-works/pi-telemetry
    filter:
      - README.md
      - "dist/**/*.d.ts"
  - from: node_modules/@earendil-works/pi-tui
    to: node_modules/@earendil-works/pi-tui
    filter:
      - README.md
      - "dist/**/*.d.ts"
  - from: node_modules/@earendil-works/pi-coding-agent/node_modules/@silvia-odwyer/photon-node
    to: node_modules/@silvia-odwyer/photon-node
    filter:
      - LICENSE.md
  - from: node_modules/quickjs-wasi/dist
    to: node_modules/quickjs-wasi/dist
    filter:
      - "**/*.d.ts"

asar: true

extraResources:
  - from: out/remote-payload
    to: remote-payload
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: build/toolchains/runtime-catalog.json
    to: toolchains/runtime-catalog.json
  - from: build/toolchains/core-catalog.json
    to: toolchains/core-catalog.json
  - from: build/toolchains/core/${platform}-${arch}
    to: toolchains/core/${platform}-${arch}

mac:
  identity: "-"
  notarize: false
  sign: ./scripts/sign-mac.mjs
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: Dexon-${version}-${arch}.${ext}

win:
  extraResources:
    - from: out/native/windows-managed-process-helper
      to: managed-process/win32-x64
      filter:
        - pi-managed-process-helper.exe
        - manifest.json
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Dexon-Unsigned-Beta-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Dexon
  include: build/installer.nsh
  preCompressedFileExtensions: []

linux:
  executableName: dexon
  executableArgs:
    - --appimage-desktop-launch
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  artifactName: Dexon-${version}-${arch}.${ext}
  synopsis: Local desktop UI for the pi coding agent

protocols:
  - name: Dexon
    schemes:
      - dexon

publish:
  provider: github
  owner: oDaiSuno
  repo: dexon
  releaseType: draft
